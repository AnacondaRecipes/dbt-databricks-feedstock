{% set name = "dbt-databricks" %}
{% set version = "1.12.1" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://github.com/{{ name.split('-')[1] }}/{{ name }}/archive/refs/tags/v{{ version }}.tar.gz
  sha256: 67ae022eb8f1984b7fb1a1bc8c949fd77b8aec9824a1fe86d47300222b796881

build:
  number: 0
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  # dbt-core/dbt-spark dep mashumaro has no py314 build (support added in mashumaro 3.17, https://github.com/Fatal1ty/mashumaro/pull/285)
  skip: true  # [py<310 or py>313]

requirements:
  host:
    - pip
    - python
    - hatchling
  run:
    - python
    - click >=8.2.0,<9.0.0
    - databricks-sdk >=0.68.0,<0.105.0
    - databricks-sql-connector >=4.1.1,<4.2.7
    - dbt-adapters >=1.22.0,<1.23.0
    - dbt-common >=1.37.0,<1.38.0
    - dbt-core >=1.11.2,<1.11.12
    - dbt-spark >=1.10.0,<1.11.0
    - keyring >=23.13.0,<25.6.0
    - packaging >=21.0,<26.0
    - pydantic >=1.10.0,<2.13.0

test:
  source_files:
    - tests/unit
    - dbt/include/databricks/macros
  imports:
    - dbt.adapters.databricks
  commands:
    - pip check
    # Tests are not adapted for py313:
    # >   raise AttributeError(item)
    # E   AttributeError: __class_getitem__
    # Can be fixed with using lates typing_extensions in tests.
    - python -m pytest -v tests/unit  # [py<313]
  requires:
    - pip
    - pytest
    - freezegun

about:
  home: https://github.com/databricks/dbt-databricks
  summary: The Databricks adapter plugin for dbt
  license: Apache-2.0
  license_family: Apache
  license_file: License.md
  description: |
    The dbt-databricks adapter contains all of the code enabling dbt to work with Databricks.
    This adapter is based off the amazing work done in dbt-spark
  dev_url: https://github.com/databricks/dbt-databricks
  doc_url: https://docs.getdbt.com/reference/resource-configs/databricks-configs

extra:
  recipe-maintainers:
    - monaldoj
